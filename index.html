<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>图文带货视频生成器</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="controls">
        <input type="file" id="file-input" accept="image/*">
        <button class="btn btn-primary" id="upload-btn">设置封面</button>
        <button class="btn btn-secondary" id="batch-add-btn">批量添加</button>
        <textarea class="text-input" id="sticker-middle" placeholder="在这里输入文案
按enter可以换行
下方贴纸尺寸设置可以更改样式"></textarea>
        <button class="btn btn-primary" id="confirm-middle-btn">确定（上方）</button>
        <textarea class="text-input" id="sticker-bottom">A：刘震云《一句顶一万句》
B：茅盾文学奖获奖作品！总有一句话能让你瞬间醒悟</textarea>
        <button class="btn btn-primary" id="confirm-bottom-btn">确定（下方）</button>
        
        <div class="size-controls">
            <div class="size-title" id="size-title-btn">📐 贴纸尺寸设置 ▲</div>
            <div class="size-content collapsed" id="size-content">
                <div class="size-section">
                    <div class="section-title">📏 尺寸设置</div>
                    <div class="size-row">
                        <label>宽度: <input type="range" id="sticker-width" min="200" max="400" value="380"></label>
                        <span id="width-value">380px</span>
                    </div>
                    <div class="size-row">
                        <label>高度: <input type="range" id="sticker-height" min="150" max="400" value="260"></label>
                        <span id="height-value">260px</span>
                    </div>
                    <div class="size-row">
                        <label>上边距: <input type="range" id="sticker-top" min="0" max="400" value="100"></label>
                        <span id="top-value">100px</span>
                    </div>
                    <div class="size-row">
                        <label>左右边距: <input type="range" id="sticker-hpadding" min="0" max="50" value="20"></label>
                        <span id="hpadding-value">20px</span>
                    </div>
                </div>
                
                <div class="size-section">
                    <div class="section-title">🎨 文字样式</div>
                    <div class="size-row">
                        <label>字体大小: <input type="range" id="sticker-font-size" min="12" max="28" value="18"></label>
                        <span id="font-size-value">18px</span>
                    </div>
                    <div class="size-row">
                        <label>字体颜色: <input type="color" id="sticker-color" value="#333333"></label>
                        <span id="color-value">#333333</span>
                    </div>
                    <div class="size-row">
                        <label>字体: </label>
                        <select id="sticker-font-family">
                            <option value="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">默认字体</option>
                            <option value="'PingFang SC', 'Microsoft YaHei', sans-serif">苹方/微软雅黑</option>
                            <option value="'STSong', 'SimSun', serif">宋体</option>
                            <option value="'STHeiti', 'SimHei', sans-serif">黑体</option>
                            <option value="'KaiTi', 'STKaiti', serif">楷体</option>
                        </select>
                    </div>
                </div>
                
                <div class="size-section">
                    <div class="section-title">🖼️ 背景样式</div>
                    <div class="size-row">
                        <label>背景颜色: <input type="color" id="sticker-bg-color" value="#ffffff"></label>
                        <span id="bg-color-value">#ffffff</span>
                    </div>
                    <div class="size-row">
                        <label>背景透明度: <input type="range" id="sticker-opacity" min="0" max="100" value="70"></label>
                        <span id="opacity-value">70%</span>
                    </div>
                    <div class="size-row">
                        <label>圆角: <input type="range" id="sticker-border-radius" min="0" max="20" value="12"></label>
                        <span id="border-radius-value">12px</span>
                    </div>
                </div>
            </div>
        </div>
        <button class="btn btn-secondary" id="download-btn">添加图片</button>
        <button class="btn btn-primary" id="batch-upload-btn">进入图片管理页面</button>
        <button class="btn btn-secondary" id="tutorial-btn">使用教程</button>
        <input type="file" id="batch-file-input" accept="image/*" multiple style="display: none;">
    </div>
    
    <div class="container" id="single-container">
        <img id="bg-image" class="bg-image-layer" alt="背景底色" crossorigin="anonymous">
        <img id="image-container" class="image-container-layer" src="" alt="预览图片" crossorigin="anonymous">
        <div class="sticker">
            <div class="sticker-part sticker-middle">在这里输入文案
按enter可以换行
下方贴纸尺寸设置可以更改样式</div>
            <div class="sticker-part sticker-bottom">
            <div class="sticker-bottom-main">刘震云《一句顶一万句》</div>
            <div class="sticker-bottom-secondary">茅盾文学奖获奖作品！总有一句话能让你瞬间醒悟</div>
        </div>
        </div>
        <label for="file-input" class="upload-overlay" id="upload-overlay" style="display: none;">
            <div class="upload-icon">📤</div>
            <div class="upload-text">点击上传图片</div>
            <div class="upload-hint">支持 JPG、PNG 格式</div>
        </label>
    </div>
    
    <div class="container" id="batch-container" style="display: none;">
        <div class="batch-content">
            <div class="batch-header">
                <h3>图片管理</h3>
                <div class="batch-actions">
                    <button class="btn btn-secondary" id="back-to-single">← 返回</button>
                    <button class="btn btn-primary" id="add-image-btn">添加图片</button>
                    <select id="transition-style" class="transition-select">
                        <option value="slide-left">滑动左移</option>
                        <option value="slide-right">滑动右移</option>
                        <option value="slide-up">滑动上移</option>
                        <option value="slide-down">滑动下移</option>
                        <option value="fade">淡入淡出</option>
                        <option value="flip">翻页效果</option>
                        <option value="zoom">缩放效果</option>
                    </select>
                    <button class="btn btn-primary" id="generate-video-btn">生成视频</button>
                </div>
            </div>
            <div class="progress-container" id="progress-container" style="display: none;">
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
                <div class="progress-text" id="progress-text">0%</div>
            </div>
            <div class="batch-images" id="batch-images-container"></div>
        </div>
    </div>

    <!-- 批量添加弹窗 -->
    <div class="modal-overlay" id="batch-add-modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>批量添加图片</h3>
                <span class="modal-close" id="modal-close">×</span>
            </div>
            <div class="modal-body">
                <textarea class="modal-textarea" id="batch-add-textarea" placeholder="请输入文案，用【】包裹每张图片的内容"></textarea>
                <div class="modal-hint">
                    💡 提示：用【】包裹每张图片的文案内容，支持多行
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="modal-cancel">取消</button>
                <button class="btn btn-primary" id="modal-confirm">确定添加</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
