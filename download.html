<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>视频下载</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .download-container {
            background: #fff;
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            max-width: 400px;
            width: 100%;
        }

        .success-icon {
            font-size: 80px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 24px;
            color: #333;
            margin-bottom: 10px;
        }

        p {
            font-size: 14px;
            color: #666;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            padding: 15px 40px;
            background: linear-gradient(135deg, #20c997, #17a2b8);
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.2s;
            margin: 10px;
        }

        .btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #fff;
            color: #333;
            border: 1px solid #e0e0e0;
        }

        .btn-secondary:hover {
            background: #f8f9fa;
        }

        .video-info {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 30px;
            text-align: left;
        }

        .video-info div {
            font-size: 14px;
            color: #666;
            margin-bottom: 5px;
        }

        .video-info div:last-child {
            margin-bottom: 0;
        }

        .video-info strong {
            color: #333;
        }
    </style>
</head>
<body>
    <div class="download-container">
        <div class="success-icon">🎉</div>
        <h1>视频生成成功！</h1>
        <p>您的视频已自动下载，可以上传到微信视频号</p>
        
        <div class="video-info">
            <div><strong>视频格式:</strong> MP4 (H.264)</div>
            <div><strong>分辨率:</strong> 1080 × 1920</div>
            <div><strong>帧率:</strong> 30 FPS</div>
        </div>

        <div>
            <a href="index.html" class="btn">继续制作</a>
        </div>
    </div>
</body>
</html>
